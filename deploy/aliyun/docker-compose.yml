# ============================================================================
# Quanta / RuoYi  ——  阿里云 ECS（MySQL + Redis + 后端）
# 日常：
#   docker compose up -d mysql redis          # 只起依赖
#   docker compose up -d app --no-deps        # 只起/重建后端，不动库
# 严禁：docker compose down -v（会删 mysql_data / redis_data）
# MySQL 仅在数据目录为空时执行 initdb/*.sql。
# ============================================================================
services:
  mysql:
    image: mysql:8.0
    container_name: quanta-mysql
    restart: unless-stopped
    # 只绑定回环，别让 3306 暴露公网
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      TZ: "Asia/Shanghai"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?set in .env}"
      MYSQL_DATABASE: "ry-vue"
      MYSQL_USER: "${MYSQL_USERNAME:-quanta}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?set in .env}"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-authentication-plugin=mysql_native_password
      - --log-bin-trust-function-creators=1
      # 2C4G：缓冲池 512M；继续关 performance_schema（可省 200~400M，留给缓冲池更划算）
      - --innodb-buffer-pool-size=512M
      - --performance-schema=OFF
      - --max-connections=100
      - --skip-name-resolve
    volumes:
      - mysql_data:/var/lib/mysql
      # upload.py sync 会把 initdb/*.sql 传到本目录的 initdb/ 子目录（服务器端路径）
      # 01 基础库 02 quartz 03 lab_full(旧) 04 lab_init(补 major 等)
      # 05 signup_remark 06 member_role 07 关验证码(生产请删除/改回 true)
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: quanta-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      # healthcheck 里的 redis-cli -a 需要容器内能读到这个变量，否则永远 NOAUTH → unhealthy
      REDIS_PASSWORD: "${REDIS_PASSWORD:?set in .env}"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "${REDIS_PASSWORD:?set in .env}"
      # 小内存机器：最多用 256M。业务缓存键全部带 TTL（见 RedisConfig 的 TTL 表），
      # 因此 volatile-lru 可淘汰所有缓存键；给到 256M 是为了缓存涨满时不至于挤掉登录令牌
      - --maxmemory
      - "256mb"
      - --maxmemory-policy
      - volatile-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 20

  app:
    image: eclipse-temurin:17-jre
    container_name: quanta-app
    restart: unless-stopped
    network_mode: host
    user: "${RUOYI_UID:-108}:${RUOYI_GID:-112}"
    working_dir: /opt/ruoyi
    environment:
      TZ: "Asia/Shanghai"
      LOG_PATH: "/home/ruoyi/logs"
    volumes:
      - /opt/ruoyi/ruoyi-admin.jar:/opt/ruoyi/ruoyi-admin.jar:ro
      - /opt/ruoyi/run.sh:/opt/ruoyi/run.sh:ro
      - /opt/ruoyi/.env:/opt/ruoyi/.env:ro
      - /opt/ruoyi/uploadPath:/opt/ruoyi/uploadPath
      - /opt/ruoyi/logs:/opt/ruoyi/logs
      - /home/ruoyi/logs:/home/ruoyi/logs
    command:
      - bash
      - -lc
      - |
        mkdir -p /opt/ruoyi/logs
        if command -v stdbuf >/dev/null 2>&1; then
          exec > >(stdbuf -oL tee -a /opt/ruoyi/logs/stdout.log)
          exec 2> >(stdbuf -oL tee -a /opt/ruoyi/logs/stderr.log >&2)
        else
          exec > >(tee -a /opt/ruoyi/logs/stdout.log)
          exec 2> >(tee -a /opt/ruoyi/logs/stderr.log >&2)
        fi
        exec bash /opt/ruoyi/run.sh
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 90s

volumes:
  mysql_data:
  redis_data:
