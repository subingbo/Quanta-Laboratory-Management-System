# Quanta —— 域名站点（HTTPS，证书就绪后由 apply-nginx.sh 启用）
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.quantacenter.com;

    ssl_certificate /etc/letsencrypt/live/www.quantacenter.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.quantacenter.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:2m;
    ssl_session_timeout 1h;

    root /opt/ruoyi/admin;
    index index.html;
    client_max_body_size 25m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    location ^~ /druid/ { return 404; }

    location ~ ^/(login|register|logout|captchaImage|getInfo|getRouters)$ {
        proxy_pass http://quanta_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location ~ ^/(dashboard|qt|system|common)/ {
        proxy_pass http://quanta_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }

    location ^~ /profile/ {
        add_header Cache-Control "public, max-age=604800";
        proxy_pass http://quanta_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
