# Quanta —— 域名站点（HTTPS，证书就绪后由 apply-nginx.sh 启用）
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.quantacenter.com;

    ssl_certificate     /etc/letsencrypt/live/www.quantacenter.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.quantacenter.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:2m;
    ssl_session_timeout 1h;

    client_max_body_size 25m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 安全响应头
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;

    # Druid 监控台不对公网开放（后端默认也已关闭）
    location ^~ /druid/ {
        return 404;
    }

    # 管理后台带 hash 的构建产物：文件名即版本，可长期缓存
    location /admin/assets/ {
        alias /opt/ruoyi/admin/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    # 管理后台静态站
    location = /admin { return 301 /admin/; }
    location /admin/ {
        alias /opt/ruoyi/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
    }

    # 上传件（证件照/图片/资料）：带类型嗅探防护 + 允许客户端缓存
    location /profile/ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options nosniff;
        proxy_pass         http://quanta_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = / { return 302 /admin/; }

    # 其余交给后端（小程序 request 合法域名就是本域名根路径）
    location / {
        proxy_pass         http://quanta_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 300s;
    }
}
