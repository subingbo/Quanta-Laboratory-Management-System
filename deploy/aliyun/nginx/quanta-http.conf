# Quanta —— 域名站点（HTTP，备案期间的当前形态）
# 统一 Web 门户部署在站点根路径；API location 必须位于 SPA fallback 之前。
server {
    listen 80;
    listen [::]:80;
    server_name www.quantacenter.com;

    root /opt/ruoyi/admin;
    index index.html;
    client_max_body_size 25m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location ^~ /druid/ { return 404; }

    location ~ ^/(login|logout|captchaImage|getInfo|getRouters)$ {
        proxy_pass http://quanta_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location ~ ^/(dashboard|qt|system|common)/ {
        proxy_pass http://quanta_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }

    location ^~ /profile/ {
        add_header Cache-Control "public, max-age=604800";
        proxy_pass http://quanta_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # /、/freshman/*、/member/*、/admin/* 共用同一份 SPA。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
