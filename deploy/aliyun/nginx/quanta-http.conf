# Quanta —— 域名站点（HTTP，备案期间的当前形态）
# 证书签发后 apply-nginx.sh 会自动停用本文件、改用 quanta-redirect.conf + quanta-https.conf
server {
    listen 80;
    listen [::]:80;
    server_name www.quantacenter.com;

    client_max_body_size 25m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 管理后台静态站（vite base=/admin/）
    location = /admin { return 301 /admin/; }
    location /admin/ {
        alias /opt/ruoyi/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache";
    }

    # 浏览器访问根路径跳后台；小程序请求的都是具体路径，不受影响
    location = / { return 302 /admin/; }

    # 其余一切交给后端（/login /getInfo /captchaImage /qt/** /system/** /common/** /profile/**）
    location / {
        proxy_pass         http://quanta_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 300s;
    }
}
