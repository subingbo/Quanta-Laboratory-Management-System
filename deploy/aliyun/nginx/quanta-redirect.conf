# Quanta —— 80 端口（HTTPS 启用后）：只保留 ACME 校验，其余强制跳 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name www.quantacenter.com quantacenter.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://www.quantacenter.com$request_uri;
    }
}
