# Quanta 招新 —— Nginx 反向代理模板
# 放到 /etc/nginx/sites-available/quanta，ln -s 到 sites-enabled 后 nginx -s reload
#
# 关键点：
# 1. uniapp 前端 request.ts 拼的是 `${BASE_URL}${url}` 且 url 不带 /prod-api →
#    后端 context-path=/ → Nginx 直接 root "/" 反代到 8080 即可，不要 rewrite 前缀。
# 2. 招新小程序 mp 后台「服务器域名」必须与本 server_name 一致（HTTPS + 已备案域名）。
# 3. 上传大小需跟 application.yml max-request-size 对齐（20MB）。
# 4. WebSocket 升级头保留（如后续接入即时消息/直播用到）。

upstream quanta_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# HTTP → HTTPS（若用云开发/自签/仅 HTTP 测，把下面 443 段先注释掉）
server {
    listen 80;
    server_name api.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass         http://quanta_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # WebSocket
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 300s;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
