# Quanta —— 纯 IP 兜底入口（常驻启用，不依赖备案，被拦时可用来救急/排查）
#   http://8.133.248.109:8081/admin/   管理后台
#   http://8.133.248.109:8081/...      后端接口
server {
    listen 8081;
    server_name _;

    client_max_body_size 25m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Druid 监控台不对公网开放（后端默认也已关闭）
    location ^~ /druid/ {
        return 404;
    }

    location /admin/assets/ {
        alias /opt/ruoyi/admin/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /admin { return 301 /admin/; }
    location /admin/ {
        alias /opt/ruoyi/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache";
    }

    location = / { return 302 /admin/; }

    location / {
        proxy_pass         http://quanta_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 300s;
    }
}
